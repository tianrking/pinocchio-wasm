<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pinocchio-wasm Browser Kinematics Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f6f7f9;
        color: #172033;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #5d667a;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 20px;
        margin-top: 24px;
      }

      .panel {
        border: 1px solid #d8dde8;
        background: #ffffff;
        border-radius: 8px;
      }

      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
      }

      .side {
        padding: 18px;
      }

      .control {
        display: grid;
        gap: 8px;
        margin-bottom: 18px;
      }

      label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 14px;
        color: #30384c;
      }

      input[type="range"] {
        width: 100%;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        background: #176b87;
        color: white;
        font-weight: 650;
        padding: 10px 12px;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 12px;
        margin: 18px 0 0;
        font-size: 13px;
      }

      dt {
        color: #667085;
      }

      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }

      pre {
        margin: 18px 0 0;
        padding: 12px;
        overflow: auto;
        background: #101828;
        color: #dbe7ff;
        border-radius: 6px;
        font-size: 12px;
      }

      @media (max-width: 820px) {
        main {
          padding: 18px;
        }

        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>pinocchio-wasm Browser Kinematics Demo</h1>
      <p>Reusable WASM buffers, direct FK calls, and a small two-link arm rendered in canvas.</p>

      <section class="layout">
        <div class="panel">
          <canvas id="arm" width="900" height="675"></canvas>
        </div>

        <aside class="panel side">
          <div class="control">
            <label for="q1">
              <span>Joint 1</span>
              <output id="q1Value">0.20 rad</output>
            </label>
            <input id="q1" type="range" min="-3.1416" max="3.1416" step="0.001" value="0.2" />
          </div>

          <div class="control">
            <label for="q2">
              <span>Joint 2</span>
              <output id="q2Value">0.30 rad</output>
            </label>
            <input id="q2" type="range" min="-3.1416" max="3.1416" step="0.001" value="0.3" />
          </div>

          <button id="benchmark" type="button">Run FK benchmark</button>

          <dl>
            <dt>Status</dt>
            <dd id="status">Loading</dd>
            <dt>Model</dt>
            <dd id="dims">-</dd>
            <dt>End effector</dt>
            <dd id="ee">-</dd>
            <dt>Last FK batch</dt>
            <dd id="bench">-</dd>
          </dl>

          <pre id="poses"></pre>
        </aside>
      </section>
    </main>

    <script type="module" src="./browser_kinematics_demo.mjs"></script>
  </body>
</html>
